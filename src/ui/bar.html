<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>VMBox Leiste</title>
  <link rel="stylesheet" href="/bar.css">
</head>
<body>
  <div id="bar">
    <button class="home" id="home" title="Dashboard (Strg+Alt+Pos1)">
      <img src="/logo.svg" alt=""><span>VMBox</span>
    </button>
    <div class="vms" id="vms"></div>
    <div class="right">
      <span class="current" id="current"></span>
      <button class="icon-btn" id="lock" title="Sperren (Strg+Alt+L)"></button>
      <span class="clock" id="clock"></span>
    </div>
  </div>
  <div id="indicator"></div>
  <script src="/icons.js"></script>
  <script src="/bar.js"></script>
</body>
</html>
