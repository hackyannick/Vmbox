<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VMBox Dashboard</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Login, first-time setup and the lock screen -->
  <section id="auth" hidden>
    <div>
      <div class="clock" id="auth-clock">--:--</div>
      <div class="date" id="auth-date"></div>
    </div>
    <form class="card glass" id="auth-form" autocomplete="off">
      <div class="wtitle"><img src="/logo.svg" alt="">VMBox Receiver</div>
      <img src="/logo.svg" alt="">
      <h1 id="auth-title">VMBox</h1>
      <p id="auth-text"></p>
      <input class="input" type="password" id="auth-password" placeholder="Passwort" autofocus>
      <input class="input" type="password" id="auth-password2" placeholder="Passwort wiederholen" hidden>
      <button class="btn primary" type="submit" id="auth-submit">Entsperren</button>
      <div class="error" id="auth-error"></div>
    </form>
    <div class="foot" id="auth-foot"></div>
  </section>

  <div id="app" hidden>
    <header id="titlebar">
      <img src="/logo.svg" alt=""><span>VMBox Receiver</span>
      <span class="live" id="live-hint" hidden title="Änderungen gehen beim Neustart verloren – unter System installieren">LIVE</span>
      <span class="grow"></span><span id="title-clock"></span>
    </header>
    <nav id="toolbar"></nav>
    <main id="main"></main>
    <footer id="footer"></footer>
  </div>
  <div id="menu" hidden></div>

  <div id="overlay"></div>
  <div id="toasts"></div>
  <script src="/icons.js"></script>
  <script src="/app.js"></script>
</body>
</html>
