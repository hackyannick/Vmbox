#!/usr/sbin/nft -f
# VMBox host firewall: the host offers no network services at all.
# VM traffic (NAT/bridged/internal) is handled by VirtualBox and does not
# pass through these chains.
flush ruleset

table inet vmbox {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        # IPv6 neighbour discovery / router advertisements and DHCPv6 replies
        meta l4proto ipv6-icmp icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big } accept
        udp sport 547 udp dport 546 accept
        meta l4proto icmp icmp type { destination-unreachable, time-exceeded } accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
