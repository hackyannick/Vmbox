# VMBox configuration - read by vmboxd at start.
[vmboxd]
# The dashboard API only ever listens on the loopback interface.
listen_host = 127.0.0.1
listen_port = 8470
socket_path = /run/vmbox/vmboxd.sock
state_dir = /var/lib/vmbox
iso_dir = /var/lib/vmbox/isos
ui_dir = /usr/share/vmbox/ui
display = :0
xauthority = /home/vmbox/.Xauthority
# Lock the screen after this many seconds without keyboard/mouse input (0 = never).
idle_lock = 900
# Login sessions of the dashboard expire after this many seconds.
session_timeout = 43200
