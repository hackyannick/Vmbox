name: VMBox

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vbox_package:
        description: "VirtualBox-Paket (leer = neuestes), z. B. virtualbox-7.2"
        required: false
        default: ""

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Werkzeuge
        run: pip install pyflakes
      - name: Lint
        run: make lint
      - name: Unit-Tests
        run: make test
      - name: Installer-Dialogtest (als root, im Pseudo-Terminal)
        run: |
          sudo apt-get install -y -qq whiptail >/dev/null
          sudo python3 -m unittest discover -s tests -p "test_installer.py" -v

  iso:
    name: ISO bauen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: live-build (Debian trixie, privilegierter Container)
        env:
          VBOX_PACKAGE: ${{ github.event.inputs.vbox_package }}
        run: |
          sudo docker run --rm --privileged \
            -e VBOX_PACKAGE -v "$PWD:/build" -w /build debian:trixie bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends live-build gnupg curl ca-certificates make \
                debootstrap squashfs-tools xorriso grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
                syslinux syslinux-common isolinux
              ./build.sh
            '
      - name: ISO prüfen
        run: |
          set -euo pipefail
          ls -lh out/
          cat out/*.sha256
          echo "--- Hook-Ausgaben ---"
          grep -E "^(I|W|E): " live/build.log | grep -Ev "^I: (Retrieving|Validating|Extracting|Unpacking|Configuring|Installing|Checking|Base|Resolving|Found|Chosen|Keyring)" || true
          sudo apt-get install -y -qq xorriso squashfs-tools >/dev/null
          ISO=$(ls out/*.iso)
          WORK=$(mktemp -d)
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs "$WORK/fs.sq" \
                  -extract /boot/grub/grub.cfg "$WORK/grub.cfg" -extract /isolinux/live.cfg "$WORK/live.cfg" 2>/dev/null
          unsquashfs -l "$WORK/fs.sq" > "$WORK/files.txt"
          echo "--- Prüfungen ---"
          for f in /usr/lib/virtualbox/VBoxHeadless /usr/lib/virtualbox/VirtualBoxVM /usr/bin/VBoxManage \
                   /misc/vboxdrv.ko /misc/vboxnetflt.ko /misc/vboxnetadp.ko \
                   /usr/lib/vmbox/vmboxd/server.py /usr/bin/vmbox-shell /usr/sbin/vmbox-installer \
                   /usr/share/vmbox/ui/index.html /etc/systemd/system/multi-user.target.wants/vmboxd.service \
                   /etc/systemd/system/multi-user.target.wants/vmbox-session.service /usr/bin/openbox /usr/bin/wmctrl \
                   /usr/bin/udisksctl /usr/sbin/mkfs.exfat /usr/bin/ntfs-3g /usr/lib/vmbox/vmboxd/media.py \
                   /etc/modprobe.d/vmbox-no-kvm.conf; do
            if grep -q -- "$f\$" "$WORK/files.txt"; then echo "OK      $f"; else echo "FEHLT   $f"; FAIL=1; fi
          done
          grep -q "vmbox.install" "$WORK/grub.cfg" && echo "OK      GRUB-Eintrag 'VMBox installieren'" || { echo "FEHLT   GRUB-Eintrag"; FAIL=1; }
          grep -q "vmbox.install" "$WORK/live.cfg" && echo "OK      ISOLINUX-Eintrag 'VMBox installieren'" || { echo "FEHLT   ISOLINUX-Eintrag"; FAIL=1; }
          grep -q "modprobe.blacklist=kvm" "$WORK/grub.cfg" && echo "OK      KVM beim Booten gesperrt (GRUB)" || { echo "FEHLT   KVM-Sperre (GRUB)"; FAIL=1; }
          grep -q "modprobe.blacklist=kvm" "$WORK/live.cfg" && echo "OK      KVM beim Booten gesperrt (ISOLINUX)" || { echo "FEHLT   KVM-Sperre (ISOLINUX)"; FAIL=1; }
          grep -E "^menuentry" "$WORK/grub.cfg" || true
          exit ${FAIL:-0}
      - name: Build-Log (Ende)
        if: failure()
        run: sudo tail -n 80 live/build.log || true
      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vmbox-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live/build.log
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vmbox-iso
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            *.sha256
