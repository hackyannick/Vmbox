name: VMBox

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vbox_package:
        description: "VirtualBox-Paket (leer = neuestes), z. B. virtualbox-7.2"
        required: false
        default: ""

jobs:
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Werkzeuge
        run: pip install pyflakes
      - name: Lint
        run: make lint
      - name: Unit-Tests
        run: make test

  iso:
    name: ISO bauen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - name: live-build (Debian trixie, privilegierter Container)
        env:
          VBOX_PACKAGE: ${{ github.event.inputs.vbox_package }}
        run: |
          sudo docker run --rm --privileged \
            -e VBOX_PACKAGE -v "$PWD:/build" -w /build debian:trixie bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends live-build gnupg curl ca-certificates make \
                debootstrap squashfs-tools xorriso grub-efi-amd64-bin grub-pc-bin mtools dosfstools \
                syslinux syslinux-common isolinux
              ./build.sh
            '
      - name: Prüfsumme & Inhalt
        if: always()
        run: |
          ls -lh out/ || true
          cat out/*.sha256 || true
          sudo tail -n 60 live/build.log || true
      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vmbox-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 14
      - name: Build-Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live/build.log
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vmbox-iso
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.iso
            *.sha256
